name: dox_inertia
description: "Inertia.js for the Dox framework: build single page apps with React, Vue or Svelte and Dox controllers, with no API to write."
version: 3.2.1
repository: https://github.com/dartondox/dox-inertia
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0

dependencies:
  dox_annotation: ^3.2.0
  dox_core: ^3.2.1
  http: ^1.6.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0

# The `dox` CLI finds the commands of this package here
# (`dox inertia:install`).
dox:
  commands: package:dox_inertia/commands.dart
